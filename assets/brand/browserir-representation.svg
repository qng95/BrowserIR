<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">BrowserIR representation example</title>
  <desc id="desc">A customer form is compiled into a compact semantic representation containing entities, state, relationships, actions, and a revision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFF"/><stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="brand" x1="540" y1="300" x2="765" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/><stop offset="0.52" stop-color="#4F7CFF"/><stop offset="1" stop-color="#9B5CFF"/>
    </linearGradient>
    <linearGradient id="panel" x1="720" y1="160" x2="1340" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101936"/><stop offset="1" stop-color="#080B1B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#192B64" flood-opacity="0.14"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="780" rx="34" fill="url(#bg)"/>
  <path d="M0 1h1400" stroke="url(#brand)" stroke-width="3" opacity="0.8"/>

  <text x="700" y="64" text-anchor="middle" fill="#0B1025" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="31" font-weight="760" letter-spacing="-1.1">The page your agent can reason over</text>
  <text x="700" y="98" text-anchor="middle" fill="#667394" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">BrowserIR compiles unstable interface details into a compact, actionable semantic map.</text>

  <!-- Browser surface -->
  <g filter="url(#shadow)">
    <rect x="55" y="145" width="500" height="535" rx="28" fill="#FFFFFF" stroke="#D6DEF2" stroke-width="2"/>
  </g>
  <path d="M56 205h498" stroke="#E4E9F5" stroke-width="2"/>
  <circle cx="88" cy="176" r="7" fill="#FF758B"/><circle cx="111" cy="176" r="7" fill="#F8C55B"/><circle cx="134" cy="176" r="7" fill="#56D49B"/>
  <rect x="169" y="161" width="333" height="30" rx="15" fill="#F2F5FB"/>
  <circle cx="191" cy="176" r="7" fill="none" stroke="#94A1BD" stroke-width="2"/><path d="m196 181 5 5" stroke="#94A1BD" stroke-width="2" stroke-linecap="round"/>
  <text x="216" y="181" fill="#76839F" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">app.example.com/customers/new</text>

  <text x="94" y="254" fill="#0B1025" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="740">Create customer</text>
  <text x="94" y="282" fill="#73809B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Add a supplier to Inventory ERP.</text>

  <text x="94" y="329" fill="#27314B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">Full name</text>
  <rect x="94" y="343" width="370" height="55" rx="12" fill="#FBFCFF" stroke="#CBD5EA" stroke-width="2"/>
  <text x="113" y="376" fill="#27314B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Ada Lovelace</text>
  <circle cx="478" cy="371" r="15" fill="#EAF0FF"/><text x="478" y="377" text-anchor="middle" fill="#4F7CFF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800">1</text>

  <text x="94" y="446" fill="#27314B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">Customer status</text>
  <rect x="94" y="460" width="370" height="55" rx="12" fill="#FBFCFF" stroke="#4F7CFF" stroke-width="2.5"/>
  <text x="113" y="493" fill="#27314B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Prospect</text>
  <path d="m431 482 8 8 8-8" fill="none" stroke="#4F7CFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="478" cy="487" r="15" fill="#EBE7FF"/><text x="478" y="493" text-anchor="middle" fill="#7957FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800">2</text>

  <rect x="94" y="531" width="370" height="96" rx="14" fill="#FFFFFF" stroke="#D6DEF2" stroke-width="2"/>
  <rect x="104" y="541" width="350" height="34" rx="8" fill="#EEF3FF"/>
  <circle cx="124" cy="558" r="5" fill="#4F7CFF"/><text x="141" y="563" fill="#26314A" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Prospect</text>
  <text x="121" y="606" fill="#5F6B86" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Active customer</text>
  <circle cx="478" cy="560" r="15" fill="#E7F8FF"/><text x="478" y="566" text-anchor="middle" fill="#0D9CD7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800">3</text>
  <rect x="330" y="642" width="134" height="18" rx="9" fill="#DDE6FF"/>
  <text x="305" y="718" text-anchor="middle" fill="#64718E" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650" letter-spacing="1.8">LIVE INTERFACE</text>

  <!-- Compile bridge -->
  <g>
    <circle cx="637" cy="411" r="54" fill="#FFFFFF" stroke="url(#brand)" stroke-width="3" filter="url(#shadow)"/>
    <path d="M612 411h48m-13-13 13 13-13 13" fill="none" stroke="url(#brand)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="637" y="490" text-anchor="middle" fill="#607096" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="750" letter-spacing="2.4">COMPILE</text>
    <path d="M555 411h28M691 411h29" stroke="url(#brand)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- IR surface -->
  <g filter="url(#shadow)">
    <rect x="720" y="145" width="625" height="535" rx="28" fill="url(#panel)" stroke="url(#brand)" stroke-width="2.5"/>
  </g>
  <path d="M721 205h623" stroke="#2A3760" stroke-width="2"/>
  <circle cx="755" cy="176" r="7" fill="#38BDF8"/><circle cx="778" cy="176" r="7" fill="#657BFF"/><circle cx="801" cy="176" r="7" fill="#9B5CFF"/>
  <text x="830" y="182" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="720">BrowserIR model view</text>
  <rect x="1188" y="160" width="120" height="31" rx="15.5" fill="#172550" stroke="#476FCF"/>
  <circle cx="1211" cy="176" r="5" fill="#56D49B"/><text x="1224" y="181" fill="#B8C7E8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="680">revision 12</text>

  <text x="760" y="245" fill="#8191B7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="720" letter-spacing="2.4">VISIBLE CONTEXT</text>
  <text x="760" y="279" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Page: Create customer</text>
  <text x="760" y="307" fill="#B8C6E4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">Text: “Add a supplier to Inventory ERP.”</text>

  <rect x="756" y="334" width="549" height="111" rx="16" fill="#111B3B" stroke="#2B4074"/>
  <circle cx="781" cy="360" r="10" fill="#0F355A" stroke="#38BDF8" stroke-width="2"/><text x="807" y="366" fill="#77D3FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">e17@r12</text>
  <text x="897" y="366" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">input · textbox</text>
  <text x="781" y="396" fill="#AEBBDA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">name="Full name"  value="Ada Lovelace"</text>
  <rect x="781" y="411" width="55" height="22" rx="11" fill="#173458"/><text x="808" y="426" text-anchor="middle" fill="#83D9FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">fill</text>
  <rect x="843" y="411" width="59" height="22" rx="11" fill="#1A2E5E"/><text x="872" y="426" text-anchor="middle" fill="#AFC2FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">focus</text>
  <rect x="909" y="411" width="58" height="22" rx="11" fill="#2A1E59"/><text x="938" y="426" text-anchor="middle" fill="#D0B7FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">hover</text>

  <rect x="756" y="461" width="549" height="135" rx="16" fill="#111B3B" stroke="#4D367D"/>
  <circle cx="781" cy="487" r="10" fill="#271C53" stroke="#9B5CFF" stroke-width="2"/><text x="807" y="493" fill="#C6A7FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">e23@r12</text>
  <text x="897" y="493" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">input · combobox</text>
  <text x="781" y="523" fill="#AEBBDA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">name="Customer status"  value="prospect"</text>
  <text x="781" y="551" fill="#AEBBDA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">state=expanded=true · enabled=true</text>
  <path d="M1094 565h62" stroke="#6E7FD0" stroke-width="2"/><circle cx="1094" cy="565" r="6" fill="#38BDF8"/><circle cx="1156" cy="565" r="6" fill="#9B5CFF"/>
  <text x="1169" y="570" fill="#AEBBDA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">option-of</text>
  <rect x="781" y="564" width="63" height="22" rx="11" fill="#173458"/><text x="812" y="579" text-anchor="middle" fill="#83D9FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">select</text>
  <rect x="851" y="564" width="55" height="22" rx="11" fill="#1A2E5E"/><text x="878" y="579" text-anchor="middle" fill="#AFC2FF" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700">click</text>

  <rect x="756" y="614" width="549" height="42" rx="12" fill="#0C132D" stroke="#27365F"/>
  <circle cx="781" cy="635" r="5" fill="#56D49B" filter="url(#glow)"/>
  <text x="798" y="641" fill="#AEBBDA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="610">targets fresh · actions exposed · 0 known omissions</text>
  <text x="1032" y="718" text-anchor="middle" fill="#64718E" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650" letter-spacing="1.8">MODEL-READY REPRESENTATION</text>

  <text x="700" y="753" text-anchor="middle" fill="#53617E" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">Meaning · state · relationships · available actions · revision safety</text>
</svg>
